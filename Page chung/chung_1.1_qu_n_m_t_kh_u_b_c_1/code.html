<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quên mật khẩu - Kumho NPP Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dbd8e4",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "primary-container": "#6063ee",
                        "primary": "#4648d4",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-fixed": "#e1e0ff",
                        "on-secondary-container": "#00714d",
                        "on-secondary-fixed": "#002113",
                        "inverse-surface": "#303038",
                        "on-tertiary-fixed-variant": "#703700",
                        "inverse-on-surface": "#f2effb",
                        "on-secondary-fixed-variant": "#005236",
                        "on-tertiary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "on-background": "#1b1b23",
                        "on-tertiary-fixed": "#301400",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb783",
                        "surface-container-highest": "#e4e1ed",
                        "tertiary-container": "#b55d00",
                        "secondary-container": "#6cf8bb",
                        "surface-container-low": "#f5f2fe",
                        "secondary-fixed": "#6ffbbe",
                        "outline": "#767586",
                        "on-surface": "#1b1b23",
                        "outline-variant": "#c7c4d7",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "tertiary": "#904900",
                        "surface": "#fcf8ff",
                        "surface-tint": "#494bd6",
                        "on-primary-container": "#fffbff",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#c0c1ff",
                        "background": "#fcf8ff",
                        "on-primary-fixed": "#07006c",
                        "surface-container-high": "#e9e6f3",
                        "inverse-primary": "#c0c1ff",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-container": "#efecf8",
                        "on-surface-variant": "#464554",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#006c49",
                        "surface-variant": "#e4e1ed",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-bright": "#fcf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "gutter": "24px",
                        "xl": "32px",
                        "xs": "4px",
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "h1": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "h2": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "h3": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "h1": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "h2": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB; /* Tonal background from style guide */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-[#F9FAFB] min-h-screen flex items-center justify-center p-md">
<!-- Auth Card Container -->
<main class="w-full max-w-[448px] bg-white rounded-lg border border-outline-variant shadow-sm overflow-hidden">
<!-- Header Section (Step Navigation) -->
<div class="px-lg pt-lg pb-sm flex items-center justify-between">
<button class="flex items-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-[20px] mr-xs group-active:scale-90">arrow_back</span>
<span class="font-label-md text-label-md">Quay lại</span>
</button>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container-high px-sm py-xs rounded-full">Bước 1 / 3</span>
</div>
<!-- Content Section -->
<div class="px-lg pb-lg pt-md">
<!-- Brand Mark / Logo Placeholder (Optional but suggested for professional look) -->
<div class="mb-xl flex justify-center">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
</div>
<!-- Titles -->
<div class="text-center mb-xl">
<h1 class="font-h2 text-h2 text-on-surface mb-sm">Quên mật khẩu</h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                    Nhập email hoặc số điện thoại đã đăng ký. Hệ thống sẽ gửi mã OTP để xác minh.
                </p>
</div>
<!-- Info Box (Tonal Alert Style) -->
<div class="bg-surface-container-low rounded-lg p-md mb-xl border-l-4 border-primary">
<h3 class="font-label-md text-label-md text-on-surface mb-sm flex items-center">
<span class="material-symbols-outlined text-primary text-[18px] mr-xs">info</span>
                    OTP sẽ được gửi qua:
                </h3>
<ul class="space-y-xs">
<li class="flex items-center text-body-md font-body-md text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] mr-sm">person</span>
<span class="font-medium">NPP:</span> ZNS hoặc SMS
                    </li>
<li class="flex items-center text-body-md font-body-md text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] mr-sm">mail</span>
<span class="font-medium">Kumho/Admin:</span> Email
                    </li>
</ul>
</div>
<!-- Form Section -->
<form class="space-y-lg">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="identity">Email / Số điện thoại</label>
<div class="relative">
<input class="w-full px-md py-sm bg-white border border-outline-variant rounded-lg text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline" id="identity" placeholder="user@example.com hoặc 09x..." type="text"/>
<div class="absolute inset-y-0 right-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">contact_mail</span>
</div>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-white font-label-md text-label-md py-md rounded-lg shadow-sm transition-all active:scale-[0.98] flex items-center justify-center gap-sm" type="button">
                    Gửi mã OTP
                    <span class="material-symbols-outlined text-[18px]">send</span>
</button>
</form>
<!-- Bottom Actions -->
<div class="mt-xl pt-lg border-t border-outline-variant text-center">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]">login</span>
                    Quay lại đăng nhập
                </a>
</div>
</div>
</main>
<!-- Visual Decoration (Background Graphic) -->
<div class="fixed inset-0 -z-10 overflow-hidden opacity-50 pointer-events-none">
<div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[40vw] h-[40vw] rounded-full bg-secondary-container/10 blur-[120px]"></div>
</div>
</body></html>
