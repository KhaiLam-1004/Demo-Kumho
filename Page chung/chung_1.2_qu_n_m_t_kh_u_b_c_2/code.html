<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dbd8e4",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "primary-container": "#6063ee",
                        "primary": "#4648d4",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-fixed": "#e1e0ff",
                        "on-secondary-container": "#00714d",
                        "on-secondary-fixed": "#002113",
                        "inverse-surface": "#303038",
                        "on-tertiary-fixed-variant": "#703700",
                        "inverse-on-surface": "#f2effb",
                        "on-secondary-fixed-variant": "#005236",
                        "on-tertiary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "on-background": "#1b1b23",
                        "on-tertiary-fixed": "#301400",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb783",
                        "surface-container-highest": "#e4e1ed",
                        "tertiary-container": "#b55d00",
                        "secondary-container": "#6cf8bb",
                        "surface-container-low": "#f5f2fe",
                        "secondary-fixed": "#6ffbbe",
                        "outline": "#767586",
                        "on-surface": "#1b1b23",
                        "outline-variant": "#c7c4d7",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "tertiary": "#904900",
                        "surface": "#fcf8ff",
                        "surface-tint": "#494bd6",
                        "on-primary-container": "#fffbff",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#c0c1ff",
                        "background": "#fcf8ff",
                        "on-primary-fixed": "#07006c",
                        "surface-container-high": "#e9e6f3",
                        "inverse-primary": "#c0c1ff",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-container": "#efecf8",
                        "on-surface-variant": "#464554",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#006c49",
                        "surface-variant": "#e4e1ed",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-bright": "#fcf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "gutter": "24px",
                        "xl": "32px",
                        "xs": "4px",
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "h1": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "h2": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "h3": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "h1": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "h2": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .otp-input:focus {
            border-color: #4648d4;
            box-shadow: 0 0 0 2px rgba(70, 72, 212, 0.2);
            outline: none;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md">
<!-- Auth Shell Component -->
<main class="w-full max-w-[480px]">
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden">
<!-- Card Header -->
<div class="px-lg pt-lg pb-sm flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-label-md text-label-md text-on-surface-variant">Bước 2 / 3</span>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</div>
<!-- Content Canvas -->
<div class="px-lg pb-lg pt-md">
<div class="text-center mb-xl">
<h1 class="font-h2 text-h2 text-on-surface mb-sm">Nhập mã OTP</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto">
                        Hệ thống đã gửi mã OTP gồm 6 chữ số đến <span class="font-semibold text-on-surface">0912345678</span>
</p>
</div>
<!-- OTP Input Group -->
<div class="flex justify-between gap-sm mb-lg">
<input class="otp-input w-full aspect-square border border-outline-variant rounded-lg bg-surface text-center font-h3 text-h3 text-primary" maxlength="1" type="text" value="1"/>
<input class="otp-input w-full aspect-square border border-outline-variant rounded-lg bg-surface text-center font-h3 text-h3 text-primary" maxlength="1" type="text" value="2"/>
<input class="otp-input w-full aspect-square border border-outline-variant rounded-lg bg-surface text-center font-h3 text-h3 text-primary" maxlength="1" type="text" value="3"/>
<input class="otp-input w-full aspect-square border border-outline-variant rounded-lg bg-surface text-center font-h3 text-h3 text-primary" maxlength="1" type="text" value="4"/>
<input class="otp-input w-full aspect-square border border-outline-variant rounded-lg bg-surface text-center font-h3 text-h3 text-primary" maxlength="1" type="text" value="5"/>
<input class="otp-input w-full aspect-square border border-outline-variant rounded-lg bg-surface text-center font-h3 text-h3 text-primary" maxlength="1" type="text" value="6"/>
</div>
<!-- Timer & Resend -->
<div class="flex flex-col items-center gap-xs mb-xl">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" data-icon="schedule">schedule</span>
<span class="font-body-md text-body-md">Mã OTP còn hiệu lực: <span class="font-medium text-on-surface">04:35</span></span>
</div>
<button class="font-label-md text-label-md text-outline cursor-not-allowed mt-xs" disabled="">
                        Gửi lại sau 45s
                    </button>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded-lg hover:opacity-90 active:scale-[0.98] transition-all mb-lg shadow-sm">
                    Xác nhận
                </button>
<!-- Footer Navigation -->
<div class="text-center">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-primary hover:underline underline-offset-4" href="#">
                        Quay lại bước trước
                    </a>
</div>
</div>
<!-- Brand Footer Visual (Optional subtle texture) -->
<div class="h-1.5 w-full flex">
<div class="h-full flex-1 bg-primary"></div>
<div class="h-full flex-1 bg-primary-container"></div>
<div class="h-full flex-1 bg-secondary"></div>
<div class="h-full flex-1 bg-tertiary"></div>
</div>
</div>
<!-- Corporate Support Text -->
<p class="text-center mt-lg font-body-md text-body-md text-on-surface-variant">
            Bạn cần hỗ trợ? <a class="text-primary font-medium" href="#">Liên hệ bộ phận kỹ thuật</a>
</p>
</main>
<!-- Visual Background Element -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-secondary/5 blur-[120px]"></div>
</div>
</body></html>
