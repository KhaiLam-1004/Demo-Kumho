<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dbd8e4",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "primary-container": "#6063ee",
                        "primary": "#4648d4",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-fixed": "#e1e0ff",
                        "on-secondary-container": "#00714d",
                        "on-secondary-fixed": "#002113",
                        "inverse-surface": "#303038",
                        "on-tertiary-fixed-variant": "#703700",
                        "inverse-on-surface": "#f2effb",
                        "on-secondary-fixed-variant": "#005236",
                        "on-tertiary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "on-background": "#1b1b23",
                        "on-tertiary-fixed": "#301400",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb783",
                        "surface-container-highest": "#e4e1ed",
                        "tertiary-container": "#b55d00",
                        "secondary-container": "#6cf8bb",
                        "surface-container-low": "#f5f2fe",
                        "secondary-fixed": "#6ffbbe",
                        "outline": "#767586",
                        "on-surface": "#1b1b23",
                        "outline-variant": "#c7c4d7",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "tertiary": "#904900",
                        "surface": "#fcf8ff",
                        "surface-tint": "#494bd6",
                        "on-primary-container": "#fffbff",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#c0c1ff",
                        "background": "#fcf8ff",
                        "on-primary-fixed": "#07006c",
                        "surface-container-high": "#e9e6f3",
                        "inverse-primary": "#c0c1ff",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-container": "#efecf8",
                        "on-surface-variant": "#464554",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#006c49",
                        "surface-variant": "#e4e1ed",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-bright": "#fcf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "gutter": "24px",
                        "xl": "32px",
                        "xs": "4px",
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "h1": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "h2": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "h3": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "h1": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "h2": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB; /* Light gray background as requested */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-checkmark-glow {
            box-shadow: 0 0 20px 0 rgba(0, 108, 73, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-md">
<!-- Success Confirmation Card -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-xl flex flex-col items-center text-center">
<!-- Large Green Checkmark Circle -->
<div class="mb-xl">
<div class="w-20 h-20 bg-secondary-container flex items-center justify-center rounded-full success-checkmark-glow">
<span class="material-symbols-outlined text-[48px] text-on-secondary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
</div>
<!-- Content Section -->
<div class="space-y-md mb-xl">
<h1 class="font-h2 text-h2 text-on-surface">
                Đặt mật khẩu thành công
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[320px] mx-auto">
                Bạn đã đổi mật khẩu thành công. Vui lòng đăng nhập lại với mật khẩu mới.
            </p>
</div>
<!-- Action Button -->
<div class="w-full">
<button class="w-full py-md px-lg bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container active:opacity-80 transition-all duration-200 shadow-sm">
                Đăng nhập ngay
            </button>
</div>
<!-- Brand Footer / Feedback (Optional subtle touch) -->
<div class="mt-xl pt-lg border-t border-outline-variant w-full">
<div class="flex items-center justify-center gap-xs text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[16px]" data-icon="verified_user">
                    verified_user
                </span>
<span class="font-label-sm text-label-sm">Kumho NPP Portal Secure Access</span>
</div>
</div>
</main>
<!-- Contextual Decorative Background Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -right-[5%] w-[400px] h-[400px] bg-primary/5 rounded-full blur-[80px]"></div>
<div class="absolute -bottom-[10%] -left-[5%] w-[400px] h-[400px] bg-secondary/5 rounded-full blur-[80px]"></div>
</div>
</body></html>
