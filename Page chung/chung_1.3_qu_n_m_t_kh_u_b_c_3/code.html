<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dbd8e4",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "primary-container": "#6063ee",
                        "primary": "#4648d4",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-fixed": "#e1e0ff",
                        "on-secondary-container": "#00714d",
                        "on-secondary-fixed": "#002113",
                        "inverse-surface": "#303038",
                        "on-tertiary-fixed-variant": "#703700",
                        "inverse-on-surface": "#f2effb",
                        "on-secondary-fixed-variant": "#005236",
                        "on-tertiary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "on-background": "#1b1b23",
                        "on-tertiary-fixed": "#301400",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb783",
                        "surface-container-highest": "#e4e1ed",
                        "tertiary-container": "#b55d00",
                        "secondary-container": "#6cf8bb",
                        "surface-container-low": "#f5f2fe",
                        "secondary-fixed": "#6ffbbe",
                        "outline": "#767586",
                        "on-surface": "#1b1b23",
                        "outline-variant": "#c7c4d7",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "tertiary": "#904900",
                        "surface": "#fcf8ff",
                        "surface-tint": "#494bd6",
                        "on-primary-container": "#fffbff",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#c0c1ff",
                        "background": "#fcf8ff",
                        "on-primary-fixed": "#07006c",
                        "surface-container-high": "#e9e6f3",
                        "inverse-primary": "#c0c1ff",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-container": "#efecf8",
                        "on-surface-variant": "#464554",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#006c49",
                        "surface-variant": "#e4e1ed",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-bright": "#fcf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "gutter": "24px",
                        "xl": "32px",
                        "xs": "4px",
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "h1": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "h2": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "h3": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "h1": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "h2": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface-container font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Suppressed based on Transactional Rule but referenced for Identity) -->
<header class="bg-surface flex justify-between items-center w-full px-lg py-sm sticky top-0 z-50 border-b border-outline-variant">
<div class="flex items-center gap-md">
<span class="text-h2 font-h1 text-primary">Kumho NPP Portal</span>
</div>
<div class="flex items-center gap-md">
<button class="hover:bg-surface-container-low transition-colors cursor-pointer p-xs rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="help">help</span>
</button>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-xl">
<!-- Centered Card Container -->
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden">
<!-- Hero Illustration / Brand Section -->
<div class="h-32 bg-gradient-to-br from-primary to-primary-container flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
<div class="z-10 bg-white/20 backdrop-blur-md rounded-full p-lg">
<span class="material-symbols-outlined text-white text-[48px]" data-icon="lock_reset" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
</div>
</div>
<!-- Content Area -->
<div class="p-lg md:p-xl space-y-xl">
<!-- Header Info -->
<div class="text-center space-y-sm">
<span class="inline-block px-md py-xs bg-primary-fixed text-on-primary-fixed-variant rounded-full font-label-sm text-label-sm">
                        Bước 3 / 3
                    </span>
<h1 class="font-h2 text-h2 text-on-surface">Đặt mật khẩu mới</h1>
<p class="font-body-md text-on-surface-variant">Tạo mật khẩu mới cho tài khoản của bạn</p>
</div>
<!-- Form Fields -->
<form class="space-y-lg">
<!-- New Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="new_password">Mật khẩu mới</label>
<div class="relative group">
<input class="w-full h-12 px-md pr-xl bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-on-surface-variant/50" id="new_password" placeholder="Nhập mật khẩu mới" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Xác nhận mật khẩu mới</label>
<div class="relative group">
<input class="w-full h-12 px-md pr-xl bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-on-surface-variant/50" id="confirm_password" placeholder="Nhập lại mật khẩu mới" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Helper Text -->
<div class="flex gap-sm p-md bg-surface-container-low rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="info" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed">
                            Mật khẩu tối thiểu 8 ký tự, gồm chữ hoa, chữ số và ký tự đặc biệt
                        </p>
</div>
<!-- Submit Action -->
<div class="pt-md">
<button class="w-full h-12 bg-primary hover:bg-primary-container text-white font-label-md text-label-md rounded-lg transition-colors shadow-sm active:scale-[0.98]" type="submit">
                            Hoàn tất
                        </button>
</div>
</form>
<!-- Footer Link -->
<div class="text-center pt-md border-t border-outline-variant">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                        Quay lại đăng nhập
                    </a>
</div>
</div>
</div>
</main>
<!-- Footer Identity Shell -->
<footer class="py-lg px-margin-desktop text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
            © 2024 Kumho Tires NPP Portal. Tất cả quyền được bảo lưu.
        </p>
</footer>
</body></html>
